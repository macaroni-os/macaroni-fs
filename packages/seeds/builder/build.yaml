image: "macaronios/terragon-minimal-devel:latest-amd64"
env:
- LC_ALL=POSIX
- MFS=/mfs
- MFS_HOST={{ .Values.mfs_host }}
- MFS_TARGET={{ .Values.mfs_target }}
- MFS_ARCH={{ .Values.mfs_arch }}
prelude:
- >-
  export HTTP_TIMEOUT=0
  anise repo update &&
  anise i -y --force --sync-repos
  sys-devel/make
  gcc
  binutils
  sys-apps/texinfo
  sys-apps/which
  sys-apps/portage
  sys-apps/diffutils
  sys-devel/patch
  sys-devel/m4
  sys-devel/gcc-config
  virtual/base
  dev-libs/libpcre2
  dev-libs/openssl
  app-misc/ca-certificates
  virtual/os-headers
  dev-libs/popt
  net-misc/rsync
  app-arch/tar
  app-arch/xz-utils
  net-misc/curl
  net-misc/wget &&
  anise cleanup --purge-repos &&
  macaronictl env-update &&
  source /etc/profile &&
  /usr/bin/gcc-config 1 &&
  source /etc/profile &&
  eselect gcc set 1 &&
  ln -s /usr/share/zoneinfo/Europe/Rome /etc/localtime &&
  macaronictl env-update &&
  eval 'locale-gen || true' &&
  cd / && rm -rf /anisebuild &&
  mkdir -p /{{ .Values.name }}/
# Prepare the MFS directories
- >-
  mkdir -p ${MFS}/cross-tools &&
  mkdir -p ${MFS}/tools/lib -p &&
  mkdir -p ${MFS}/sources -p
  mkdir -p ${MFS}/build -p
package_dir: /{{ .Values.name }}/

image: "macaronios/terragon-minimal-devel:latest-amd64"
prelude:
- >-
  export HTTP_TIMEOUT=0 &&
  anise repo update &&
  anise upgrade -y &&
  anise i -y --force --sync-repos
  app-admin/whip
  sys-apps/whip-catalog
  sys-devel/make
  gcc
  binutils
  sys-apps/texinfo
  sys-apps/which
  sys-apps/portage
  sys-apps/diffutils
  sys-apps/baselayout
  sys-apps/coreutils
  sys-devel/patch
  sys-devel/m4
  sys-devel/bison
  sys-devel/gcc-config
  sys-kernel/linux-headers
  virtual/base
  dev-libs/libpcre2
  dev-libs/openssl
  app-misc/ca-certificates
  virtual/os-headers
  dev-libs/popt
  net-misc/rsync
  app-arch/tar
  app-arch/xz-utils
  net-misc/curl
  net-misc/wget &&
  macaronictl env-update &&
  source /etc/profile &&
  /usr/bin/gcc-config 1 &&
  source /etc/profile &&
  eselect gcc set 1 &&
  ln -s /usr/share/zoneinfo/Europe/Rome /etc/localtime &&
  eval 'locale-gen || true' &&
  anise miner ri virtual/base &&
  anise cleanup --purge-repos &&
  macaronictl env-update &&
  cd / && rm -rf /anisebuild &&
  eval 'mkdir /tmp || true' &&
  chmod a+rwx /tmp &&
  mkdir -p /{{ .Values.name }}/

package_dir: /{{ .Values.name }}/

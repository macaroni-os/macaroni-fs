{{- $v := ( index .Values.labels "original.package.version" ) }}
prelude:
# Download and unpack the package
- >-
  wget -O ${MFS}/sources/{{ .Values.name }}-{{ $v }}.tar.xz
  https://ftp.gnu.org/gnu/{{ .Values.name }}/{{ .Values.name }}-{{ $v }}/{{ .Values.name }}-{{ $v }}.tar.xz &&
  cd ${MFS}/build/ &&
  tar -xJf ${MFS}/sources/{{ .Values.name }}-{{ $v }}.tar.xz

# error: bootstrapping with --disable-libstdcxx is not supported
# --disable-libstdcxx
steps:
- >-
  mkdir -p /step1/{{ .Values.name }}/ &&
  export PATH=${MFS}/tools/bin:/usr/bin:/bin &&
  cd ${MFS}/build/{{ .Values.name }}-{{ $v }} &&
  mkdir gcc-build && cd gcc-build
  &&
{{- $makeopts := .Values.makeopts | default false }}
{{- if $makeopts }}
  export MAKEOPTS="{{ $makeopts }}" &&
{{- else }}
  export MAKEOPTS="-j$(nproc)" &&
{{- end }}
  AR=ar LDFLAGS="-Wl,-rpath,${MFS}/cross-tools/lib"
  {{- $gcc_arch := .Values.gcc_arch | default "" }}
  {{- $gcc_cpu := .Values.gcc_cpu | default "" }}
  {{- $gcc_tune := .Values.gcc_tune | default "" }}
  {{- $gcc_fpu := .Values.gcc_fpu | default "" }}
  {{- $gcc_float := .Values.gcc_float | default "" }}
  ../configure
  {{- if ( ne $gcc_arch "" ) }}
  --with-arch={{ $gcc_arch }}
  {{- end }}
  {{- if ( ne $gcc_cpu "" ) }}
  --with-cpu={{ $gcc_cpu }}
  {{- end }}
  {{- if ( ne $gcc_tune "" ) }}
  --with-tune={{ $gcc_tune }}
  {{- end }}
  {{- if ( ne $gcc_fpu "" ) }}
  --with-fpu={{ $gcc_fpu }}
  {{- end }}
  {{- if ( ne $gcc_float "" ) }}
  --with-float={{ $gcc_float }}
  {{- end }}
  --prefix=${MFS}/cross-tools
  --build=${MFS_HOST}
  --host=${MFS_HOST}
  --target=${MFS_TARGET}
  --with-sysroot=${MFS}
  --with-native-system-header-dir=/usr/include
  --disable-shared
  --without-headers
  --with-newlib
  --enable-initfini-array
  --disable-decimal-float
  --disable-libgomp
  --disable-libssp
  --disable-libatomic
  --disable-libitm
  --disable-libsanitizer
  --disable-libquadmath
  --disable-libvtv
  --disable-libcilkrts
  --disable-threads
  --disable-multilib
  --enable-languages=c,c++
  --with-mpfr=${MFS}/cross-tools
  --with-gmp=${MFS}/cross-tools
  --with-mpc=${MFS}/cross-tools
  &&
  make ${MAKEOPTS} all-gcc &&
  make ${MAKEOPTS} all-target-libgcc &&
  make ${MAKEOPTS} install-gcc &&
  make ${MAKEOPTS} install-target-libgcc &&
  make ${MAKEOPTS} DESTDIR="/step1/{{ .Values.name }}" install-gcc &&
  make ${MAKEOPTS} DESTDIR="/step1/{{ .Values.name }}" install-target-libgcc

# The pass-1 build (--with-newlib) installs the generated boot limits.h
# (MB_LEN_MAX 1, no chain to the C library). With glibc 2.42+ under C23
# the fortify header rejects that value ("Assumed value of MB_LEN_MAX
# wrong"), breaking every gnulib-based package (m4 and friends). Replace
# it with the regular wrapper: system header via include_next first so
# C-library values win, then glimits.h for the compiler-provided macros
# (all #ifndef-guarded, non-clobbering). Verified by m4 1.4.21 full
# build before shipping.
- >-
  export D=${MFS}/cross-tools/lib/gcc/${MFS_TARGET}/{{ $v }}/include &&
  cp ${MFS}/build/gcc-{{ $v }}/gcc/glimits.h "$D/glimits.h" &&
  printf '%s\n'
  '/* GCC limits.h wrapper: system header first (C library values win),'
  '   then the compiler-provided macros from glimits.h. */'
  '#ifndef _GCC_LIMITS_H_'
  '#define _GCC_LIMITS_H_'
  '#ifndef _LIBC_LIMITS_H_'
  '#define _GCC_NEXT_LIMITS_H'
  '#include_next <limits.h>'
  '#endif'
  '#include "glimits.h"'
  '#endif' > "$D/limits.h" &&
  mkdir -p "/step1/{{ .Values.name }}${MFS}/cross-tools/lib/gcc/${MFS_TARGET}/{{ $v }}/include" &&
  cp "$D/limits.h" "$D/glimits.h" "/step1/{{ .Values.name }}${MFS}/cross-tools/lib/gcc/${MFS_TARGET}/{{ $v }}/include/"

package_dir: /step1/{{ .Values.name }}/mfs
requires:
- category: step1
  name: mpc
  version: '>=0'

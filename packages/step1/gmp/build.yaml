{{- $v := ( index .Values.labels "original.package.version" ) }}
prelude:
# Download and unpack the package
- >-
  wget -O ${MFS}/sources/gmp-{{ $v }}.tar.xz
  https://ftp.gnu.org/gnu/gmp/gmp-{{ $v }}.tar.xz &&
  cd ${MFS}/build/ &&
  tar -xJf ${MFS}/sources/gmp-{{ $v }}.tar.xz
steps:
- >-
  mkdir -p /step1/{{ .Values.name }}/ &&
  export PATH=${MFS}/tools/bin:/usr/bin:/bin &&
  cd ${MFS}/build/gmp-{{ $v }} &&
  ./configure
  --prefix=${MFS}/cross-tools
  --enable-cxx
  --disable-static
  &&
  make &&
  make check &&
  make install &&
  make DESTDIR="/step1/{{ .Values.name }}" install

package_dir: /step1/{{ .Values.name }}/mfs
requires:
- category: step1
  name: binutils
  version: '>=0'

{{- $v := ( index .Values.labels "original.package.version" ) }}
prelude:
# Download and unpack the sources. The LFS patches ship in patches/ (see
# steps: they are staged into ${MFS}/sources so the future step1/sources
# package carries them for step2 and they are not vendored twice).
- >-
  wget -O ${MFS}/sources/glibc-{{ $v }}.tar.xz
  https://ftp.gnu.org/gnu/glibc/glibc-{{ $v }}.tar.xz &&
  cd ${MFS}/build/ &&
  tar -xJf ${MFS}/sources/glibc-{{ $v }}.tar.xz
steps:
# Install and build package
- >-
  mkdir -p /step1/{{ .Values.name }}/ &&
  export PATH=${MFS}/cross-tools/bin:${MFS}/tools/bin:/usr/bin:/bin &&
  cp -a /anisebuild/patches ${MFS}/sources/ &&
  {{- if eq .Values.mfs_bits 64 }}
  ln -sfv ../lib/ld-linux-x86-64.so.2 ${MFS}/lib64 &&
  ln -sfv ../lib/ld-linux-x86-64.so.2 ${MFS}/lib64/ld-lsb-x86-64.so.3 &&
  {{- end }}
  cd ${MFS}/build/glibc-{{ $v }} &&
  patch -Np1 -i ${MFS}/sources/patches/glibc-fhs-1.patch &&
  patch -Np1 -i ${MFS}/sources/patches/glibc-{{ $v }}-upstream_fixes-3.patch &&
  mkdir -p build && cd build &&
{{- $makeopts := .Values.makeopts | default false }}
{{- if $makeopts }}
  export MAKEOPTS="{{ $makeopts }}" &&
{{- else }}
  export MAKEOPTS="-j$(nproc)" &&
{{- end }}
  echo "rootsbindir=/usr/sbin" > configparms &&
  ../configure
  --prefix=/usr
  --host=${MFS_TARGET}
  --build=$(../scripts/config.guess)
  --disable-nscd
  libc_cv_slibdir=/usr/lib
  --enable-kernel=5.10
  CC=${MFS_TARGET}-gcc
  &&
  make ${MAKEOPTS} &&
  make ${MAKEOPTS} DESTDIR=${MFS} install &&
  sed '/RTLDLIST=/s@/usr@@g' -i ${MFS}/usr/bin/ldd &&
  echo 'int main(){}' | ${MFS_TARGET}-gcc -x c - -v -Wl,--verbose &> dummy.log &&
  readelf -l a.out | grep ': /lib' &&
  grep -E -o 'S?crt[1in].o succeeded' dummy.log &&
  grep "${MFS}/usr/lib/libc.so.6 succeeded" dummy.log &&
  grep "found ld-linux" dummy.log &&
  rm -f a.out dummy.log &&
  make ${MAKEOPTS} DESTDIR="/step1/{{ .Values.name }}${MFS}" install &&
  sed '/RTLDLIST=/s@/usr@@g' -i "/step1/{{ .Values.name }}${MFS}/usr/bin/ldd"
  {{- if eq .Values.mfs_bits 64 }}
  &&
  mkdir -p /step1/{{ .Values.name }}${MFS}/lib64 &&
  cd /step1/{{ .Values.name }}${MFS}/lib64 &&
  ln -s ../usr/lib/ld-linux-x86-64.so.2 . &&
  ln -s ../usr/lib/ld-linux-x86-64.so.2 ld-lsb-x86-64.so.3 &&
  cd -
  {{- end }}
package_dir: /step1/{{ .Values.name }}/mfs
requires:
- category: step1
  name: gcc
  version: '>=0'

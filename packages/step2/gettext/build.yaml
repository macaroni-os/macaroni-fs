{{- $v := ( index .Values.labels "original.package.version" ) }}
env:
- LC_ALL=POSIX
# The payload is the /step2 tree: the build installs into the package tree
# first (DESTDIR) and then mirrors it live, so payload == installed tree.
package_dir: /step2/{{ .Values.name }}
prelude:
# Download the source only when step1/sources did not already carry it, and
# keep it in /sources for the following packages (step2/wget-style fetch).
- >-
  if [ ! -f /sources/{{ .Values.name }}-{{ $v }}.tar.xz ]; then
  wget -O /sources/{{ .Values.name }}-{{ $v }}.tar.xz
  https://ftpmirror.gnu.org/{{ .Values.name }}/{{ .Values.name }}-{{ $v }}.tar.xz ;
  fi
steps:
# LFS-13.1 ch.7.7: the temporary tool set only needs msgfmt, msgmerge and
# xgettext, so skip the shared libraries with --disable-shared. Unpack in
# /build and drop it before the final image.
- >-
  mkdir -p /build /step2/{{ .Values.name }}/usr/bin &&
  cd /build &&
  tar -xJf /sources/{{ .Values.name }}-{{ $v }}.tar.xz &&
  cd /build/{{ .Values.name }}-{{ $v }} &&
  ./configure --disable-shared &&
{{- $makeopts := .Values.makeopts | default false }}
{{- if $makeopts }}
  export MAKEOPTS="{{ $makeopts }}" &&
{{- else }}
  export MAKEOPTS="-j$(nproc)" &&
{{- end }}
  make ${MAKEOPTS} &&
  cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin &&
  cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /step2/{{ .Values.name }}/usr/bin &&
  rm -rf /build
requires:
- category: step2
  name: chroot
  version: '>=0'
